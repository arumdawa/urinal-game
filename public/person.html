<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VS Person - Urinal Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1d1f22, #34383d);
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px 18px;
    }
    .page { width: min(920px, 100%); margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 8px; letter-spacing: 2px; }
    .subtitle { text-align: center; color: #aaa; margin-bottom: 28px; }
    .card {
      background: rgba(0,0,0,.52);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,.3);
    }
    .hidden { display: none !important; }
    .top-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .big-button, .primary, .secondary {
      min-height: 48px;
      border: 0;
      border-radius: 9px;
      font-weight: bold;
    }
    .big-button { min-height: 72px; font-size: 18px; }
    .primary { background: #fff; color: #111; }
    .secondary { background: #555; color: #fff; }
    .danger { background: #242424; color: #fff; border: 1px solid #555; }
    .section-title { font-size: 20px; margin-bottom: 18px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; color: #bbb; font-size: 13px; font-weight: bold; margin-bottom: 7px; }
    .field input {
      width: 100%; height: 44px; border-radius: 8px; border: 1px solid #666;
      background: #141618; color: #fff; padding: 0 12px; outline: none;
    }
    .settings { display: flex; flex-direction: column; gap: 9px; margin-top: 18px; }
    .setting-row {
      min-height: 50px; display: flex; justify-content: space-between; align-items: center;
      gap: 10px; padding: 9px 11px; border-radius: 8px; background: rgba(255,255,255,.05);
    }
    .setting-name { font-size: 14px; font-weight: bold; color: #ddd; }
    .choice, .number-control { display: flex; gap: 7px; align-items: center; }
    .choice button, .number-control button {
      border: 1px solid #666; background: #17191b; color: #aaa; border-radius: 7px; height: 34px; min-width: 46px; font-weight: bold;
    }
    .choice button.selected { background: #fff; color: #111; border-color: #fff; }
    .number-control button { width: 34px; min-width: 34px; font-size: 20px; background: #555; color: #fff; border: 0; }
    .number-value { min-width: 72px; text-align: center; font-weight: bold; }
    .button-row { display: flex; gap: 10px; margin-top: 22px; }
    .button-row button { flex: 1; }
    .room-list { display: flex; flex-direction: column; gap: 10px; }
    .room-item {
      display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
      padding: 14px; border-radius: 9px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    }
    .room-title { font-size: 17px; font-weight: bold; margin-bottom: 5px; }
    .room-meta { font-size: 12px; color: #aaa; line-height: 1.6; }
    .room-item button { padding: 9px 14px; border-radius: 7px; border: 0; font-weight: bold; }
    .empty { color: #888; text-align: center; padding: 35px 10px; }
    .lobby-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 20px 0; }
    .player-box { padding: 18px; border-radius: 10px; background: rgba(255,255,255,.06); text-align: center; }
    .player-role { color: #999; font-size: 12px; margin-bottom: 7px; }
    .player-name { font-size: 19px; font-weight: bold; margin-bottom: 8px; }
    .ready-state { font-size: 13px; color: #aaa; }
    .ready { color: #7ee787; font-weight: bold; }
    .waiting { color: #ffcc66; font-weight: bold; }
    .room-code { text-align: center; color: #aaa; margin-top: 6px; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 18px; }
    .summary-item { background: rgba(0,0,0,.24); border-radius: 7px; padding: 10px; text-align: center; }
    .summary-label { font-size: 11px; color: #888; margin-bottom: 4px; }
    .summary-value { font-size: 14px; font-weight: bold; }
    .message {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,.72); z-index: 1000; padding: 20px;
    }
    .message.show { display: flex; }
    .message-box { width: min(420px, 100%); background: #25282c; border: 1px solid #555; border-radius: 12px; padding: 24px; text-align: center; }
    .message-box p { line-height: 1.7; margin: 16px 0 20px; }
    .message-box button { width: 100%; height: 42px; border-radius: 7px; border: 0; font-weight: bold; }
    @media (max-width: 650px) {
      .top-actions, .lobby-grid { grid-template-columns: 1fr; }
      .setting-row { align-items: flex-start; flex-direction: column; }
      .choice, .number-control { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>VS PERSON</h1>
    <div class="subtitle" id="player-name-label">PLAYER</div>

    <section id="mode-view" class="card">
      <div class="top-actions">
        <button id="show-create" class="big-button primary">방 생성</button>
        <button id="show-join" class="big-button secondary">방 참가</button>
      </div>
      <div class="button-row">
        <button id="back-main" class="secondary">메인으로</button>
      </div>
    </section>

    <section id="create-view" class="card hidden">
      <div class="section-title">방 생성</div>
      <div class="field">
        <label for="room-title">방 제목</label>
        <input id="room-title" maxlength="40" placeholder="방 제목을 입력하세요">
      </div>
      <div class="field">
        <label for="room-password">비밀번호 (선택 / 4자리 숫자)</label>
        <input id="room-password" maxlength="4" inputmode="numeric" placeholder="미설정 가능">
      </div>

      <div class="settings">
        <div class="setting-row">
          <div class="setting-name">배치 형태</div>
          <div class="choice">
            <button id="layout-line" class="selected">직선</button>
            <button id="layout-circle">원형</button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-name">변기 수</div>
          <div class="number-control">
            <button data-target="urinals" data-delta="-1">-</button>
            <div id="urinals-value" class="number-value">12개</div>
            <button data-target="urinals" data-delta="1">+</button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-name">0 카드</div>
          <div class="number-control">
            <button data-target="zero" data-delta="-1">-</button>
            <div id="zero-value" class="number-value">1장</div>
            <button data-target="zero" data-delta="1">+</button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-name">흰색 카드 (2~4)</div>
          <div class="number-control">
            <button data-target="white" data-delta="-1">-</button>
            <div id="white-value" class="number-value">7세트</div>
            <button data-target="white" data-delta="1">+</button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-name">회색 카드 (5~7)</div>
          <div class="number-control">
            <button data-target="gray" data-delta="-1">-</button>
            <div id="gray-value" class="number-value">3세트</div>
            <button data-target="gray" data-delta="1">+</button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-name">검정 카드 (8~10)</div>
          <div class="number-control">
            <button data-target="black" data-delta="-1">-</button>
            <div id="black-value" class="number-value">1세트</div>
            <button data-target="black" data-delta="1">+</button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-name">청소시간 <button id="cleaning-info" type="button" style="width:22px;height:22px;min-width:22px;padding:0;border-radius:50%;border:1px solid #777;background:#444;color:#fff;font-size:12px;font-weight:bold;">?</button></div>
          <div class="choice">
            <button id="cleaning-yes">YES</button>
            <button id="cleaning-no" class="selected">NO</button>
          </div>
        </div>

        <div id="cleaning-turn-row" class="setting-row hidden">
          <div class="setting-name">청소 시간</div>
          <div class="number-control">
            <button data-target="cleaningTurns" data-delta="-1">-</button>
            <div id="cleaningTurns-value" class="number-value">10턴</div>
            <button data-target="cleaningTurns" data-delta="1">+</button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-name">총 카드 세트</div>
          <div id="total-value" class="number-value">11세트</div>
        </div>
      </div>

      <div class="button-row">
        <button id="create-cancel" class="secondary">CANCEL</button>
        <button id="create-room" class="primary">CREATE</button>
      </div>
    </section>

    <section id="join-view" class="card hidden">
      <div class="section-title">방 참가</div>
      <div id="room-list" class="room-list"></div>
      <div class="button-row">
        <button id="refresh-rooms" class="primary">새로고침</button>
        <button id="join-cancel" class="secondary">CANCEL</button>
      </div>
    </section>

    <section id="lobby-view" class="card hidden">
      <div class="section-title" id="lobby-title">대기실</div>
      <div class="room-code" id="lobby-code"></div>
      <div id="lobby-summary" class="summary"></div>

      <div class="lobby-grid">
        <div class="player-box">
          <div class="player-role">HOST / PLAYER 1</div>
          <div id="host-name" class="player-name">-</div>
          <div class="ready-state ready">방장</div>
        </div>
        <div class="player-box">
          <div class="player-role">GUEST / PLAYER 2</div>
          <div id="guest-name" class="player-name">대기 중</div>
          <div id="guest-ready-state" class="ready-state waiting">참가자 대기 중</div>
        </div>
      </div>

      <div class="button-row">
        <button id="ready-button" class="primary hidden">READY</button>
        <button id="start-button" class="primary hidden" disabled>START</button>
        <button id="lobby-exit" class="secondary">나가기</button>
      </div>
    </section>
  </main>

  <div id="message" class="message">
    <div class="message-box">
      <h3 id="message-title">안내</h3>
      <p id="message-text"></p>
      <button id="message-close" class="primary">확인</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="person.js"></script>
</body>
</html>
