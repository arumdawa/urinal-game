<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Urinal Game</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #1d1f22,
                    #34383d
                );

            font-family: Arial, sans-serif;

            color: white;
        }


        /* ========================================
           메인 메뉴
        ======================================== */

        .menu-container {
            width: 420px;

            padding: 40px 50px;

            background:
                rgba(0, 0, 0, 0.55);

            border:
                2px solid
                rgba(255, 255, 255, 0.2);

            border-radius: 18px;

            box-shadow:
                0 15px 50px
                rgba(0, 0, 0, 0.45);

            text-align: center;
        }


        .game-title {
            font-size: 42px;
            font-weight: bold;

            letter-spacing: 3px;

            margin-bottom: 8px;
        }


        .game-subtitle {
            font-size: 14px;

            color: #aaa;

            margin-bottom: 28px;

            letter-spacing: 2px;
        }


        /* ========================================
           이름
        ======================================== */

        .player-name-area {
            margin-bottom: 25px;

            text-align: left;
        }


        .player-name-label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: bold;

            color: #bbb;

            letter-spacing: 1px;
        }


        .player-name-input {
            width: 100%;
            height: 46px;

            padding: 0 13px;

            border:
                1px solid #666;

            border-radius: 8px;

            background: #151719;
            color: white;

            font-size: 17px;

            outline: none;
        }


        .player-name-input:focus {
            border-color: #aaa;

            box-shadow:
                0 0 0 2px
                rgba(255, 255, 255, 0.08);
        }


        .current-name {
            margin-top: 8px;

            font-size: 12px;

            color: #888;
        }


        .current-name span {
            color: #ddd;

            font-weight: bold;
        }


        /* ========================================
           메인 버튼
        ======================================== */

        .menu-buttons {
            display: flex;
            flex-direction: column;

            gap: 14px;
        }


        .menu-button {
            width: 100%;
            height: 58px;

            border: none;

            border-radius: 10px;

            background: #eee;
            color: #222;

            font-size: 19px;
            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            transition:
                transform 0.15s,
                background 0.15s,
                box-shadow 0.15s;
        }


        .menu-button:hover {
            transform:
                translateY(-2px);

            background: white;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.35);
        }


        #help-button {
            background: #888;
            color: white;
        }


        #exit-button {
            background: #222;
            color: white;

            border:
                1px solid #555;
        }


        .version {
            margin-top: 25px;

            color: #777;

            font-size: 12px;
        }


        /* ========================================
           팝업
        ======================================== */

        .popup-background {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: none;

            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, 0.78);

            z-index: 1000;
        }


        .popup {
            width: 460px;

            max-height: 90vh;

            overflow-y: auto;

            padding: 30px;

            background: #25282c;

            border:
                1px solid #555;

            border-radius: 14px;

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, 0.5);
        }


        .popup h2 {
            margin-bottom: 24px;

            text-align: center;
        }


        /* ========================================
           AI 난이도
        ======================================== */

        .difficulty-area {
            margin-bottom: 20px;
        }


        .setting-label {
            display: block;

            margin-bottom: 7px;

            color: #ccc;

            font-size: 14px;
            font-weight: bold;
        }


        .difficulty-select {
            width: 100%;
            height: 44px;

            padding: 0 10px;

            border:
                1px solid #666;

            border-radius: 7px;

            background: #151719;
            color: white;

            font-size: 16px;
        }


        /* ========================================
           게임 설정
        ======================================== */

        .game-settings {
            display: flex;
            flex-direction: column;

            gap: 10px;
        }


        .setting-row {
            min-height: 50px;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 8px 10px;

            background:
                rgba(255, 255, 255, 0.05);

            border-radius: 8px;
        }


        .setting-name {
            display: flex;

            align-items: center;

            gap: 6px;

            color: #ddd;

            font-size: 15px;
            font-weight: bold;
        }


        /* ========================================
           ? 버튼
        ======================================== */

        .info-button {
            width: 22px;
            height: 22px;

            border:
                1px solid #777;

            border-radius: 50%;

            background: #444;
            color: white;

            font-size: 13px;
            font-weight: bold;

            cursor: pointer;
        }


        .info-button:hover {
            background: #666;
        }


        /* ========================================
           선택 버튼
        ======================================== */

        .choice-buttons {
            display: flex;

            gap: 6px;
        }


        .choice-button {
            min-width: 70px;
            height: 36px;

            padding: 0 12px;

            border:
                1px solid #666;

            border-radius: 7px;

            background: #151719;
            color: #aaa;

            font-weight: bold;

            cursor: pointer;
        }


        .choice-button.selected {
            background: white;
            color: #111;

            border-color: white;
        }


        /* ========================================
           - 숫자 +
        ======================================== */

        .number-control {
            display: flex;

            align-items: center;

            gap: 8px;
        }


        .number-button {
            width: 36px;
            height: 36px;

            border: none;

            border-radius: 7px;

            background: #555;
            color: white;

            font-size: 22px;
            font-weight: bold;

            cursor: pointer;
        }


        .number-button:hover {
            background: #777;
        }


        .number-value {
            min-width: 76px;

            text-align: center;

            color: white;

            font-size: 16px;
            font-weight: bold;
        }


        #cleaning-turn-row {
            display: none;

            background:
                rgba(255, 255, 255, 0.08);

            border-left:
                3px solid #aaa;
        }


        /* ========================================
           총 카드 세트
        ======================================== */

        .total-row {
            margin-top: 5px;

            background:
                rgba(255, 255, 255, 0.1);

            border:
                1px solid
                rgba(255, 255, 255, 0.15);
        }


        .total-value {
            color: white;

            font-size: 18px;
            font-weight: bold;
        }


        /* ========================================
           팝업 하단 버튼
        ======================================== */

        .popup-buttons {
            display: flex;

            gap: 10px;

            margin-top: 24px;
        }


        .popup-button {
            flex: 1;

            height: 44px;

            border: none;

            border-radius: 7px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }


        .start-button {
            background: white;
            color: #111;
        }


        .cancel-button {
            background: #555;
            color: white;
        }


        /* ========================================
           메시지 팝업
        ======================================== */

        #message-popup {
            z-index: 1100;
        }


        .message-content {
            margin-bottom: 24px;

            color: #ddd;

            line-height: 1.7;

            text-align: center;
        }


        .help-main-text {
            margin-bottom: 18px;

            font-size: 16px;
            font-weight: bold;

            line-height: 1.6;
        }


        .help-small-text {
            color: #aaa;

            font-size: 12px;

            line-height: 1.5;
        }

    </style>

</head>


<body>


    <!-- ========================================
         메인 메뉴
    ======================================== -->

    <div class="menu-container">


        <div class="game-title">
            URINAL GAME
        </div>


        <div class="game-subtitle">
            STRATEGY CARD GAME
        </div>


        <!-- 이름 -->

        <div class="player-name-area">

            <label
                for="player-name-input"
                class="player-name-label"
            >
                PLAYER NAME
            </label>


            <input
                id="player-name-input"
                class="player-name-input"
                type="text"
                maxlength="16"
                value="PLAYER"
            >


            <div class="current-name">

                현재 이름:

                <span id="current-name-display">
                    PLAYER
                </span>

            </div>

        </div>


        <!-- 메뉴 -->

        <div class="menu-buttons">

            <button
                id="vs-ai-button"
                class="menu-button"
            >
                VS AI
            </button>


            <button
                id="vs-person-button"
                class="menu-button"
            >
                VS PERSON
            </button>


            <button
                id="help-button"
                class="menu-button"
            >
                HELP
            </button>


            <button
                id="exit-button"
                class="menu-button"
            >
                EXIT
            </button>

        </div>


        <div class="version">
            TEST VERSION
        </div>

    </div>



    <!-- ========================================
         VS AI 설정창
    ======================================== -->

    <div
        id="game-setting-popup"
        class="popup-background"
    >

        <div class="popup">


            <h2>
                VS AI
            </h2>


            <!-- AI 난이도 -->

            <div class="difficulty-area">

                <label
                    for="difficulty-select"
                    class="setting-label"
                >
                    AI DIFFICULTY
                </label>


                <select
                    id="difficulty-select"
                    class="difficulty-select"
                >

                    <option value="easy">
                        EASY
                    </option>

                    <option value="normal">
                        NORMAL
                    </option>

                    <option value="hard">
                        HARD
                    </option>

                </select>

            </div>


            <div class="game-settings">


                <!-- 배치 -->

                <div class="setting-row">

                    <div class="setting-name">
                        배치 형태
                    </div>


                    <div class="choice-buttons">

                        <button
                            id="layout-line-button"
                            class="choice-button selected"
                            type="button"
                        >
                            직선
                        </button>


                        <button
                            id="layout-circle-button"
                            class="choice-button"
                            type="button"
                        >
                            원형
                        </button>

                    </div>

                </div>


                <!-- 변기 -->

                <div class="setting-row">

                    <div class="setting-name">
                        변기 수
                    </div>


                    <div class="number-control">

                        <button
                            class="number-button"
                            data-action="minus"
                            data-target="urinal"
                        >
                            -
                        </button>


                        <div
                            id="urinal-value"
                            class="number-value"
                        >
                            12개
                        </div>


                        <button
                            class="number-button"
                            data-action="plus"
                            data-target="urinal"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- 0 -->

                <div class="setting-row">

                    <div class="setting-name">
                        0 카드
                    </div>


                    <div class="number-control">

                        <button
                            class="number-button"
                            data-action="minus"
                            data-target="zero"
                        >
                            -
                        </button>


                        <div
                            id="zero-value"
                            class="number-value"
                        >
                            1장
                        </div>


                        <button
                            class="number-button"
                            data-action="plus"
                            data-target="zero"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- 흰색 -->

                <div class="setting-row">

                    <div class="setting-name">
                        흰색 카드 (2~4)
                    </div>


                    <div class="number-control">

                        <button
                            class="number-button"
                            data-action="minus"
                            data-target="white"
                        >
                            -
                        </button>


                        <div
                            id="white-value"
                            class="number-value"
                        >
                            7세트
                        </div>


                        <button
                            class="number-button"
                            data-action="plus"
                            data-target="white"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- 회색 -->

                <div class="setting-row">

                    <div class="setting-name">
                        회색 카드 (5~7)
                    </div>


                    <div class="number-control">

                        <button
                            class="number-button"
                            data-action="minus"
                            data-target="gray"
                        >
                            -
                        </button>


                        <div
                            id="gray-value"
                            class="number-value"
                        >
                            3세트
                        </div>


                        <button
                            class="number-button"
                            data-action="plus"
                            data-target="gray"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- 검정 -->

                <div class="setting-row">

                    <div class="setting-name">
                        검정 카드 (8~10)
                    </div>


                    <div class="number-control">

                        <button
                            class="number-button"
                            data-action="minus"
                            data-target="black"
                        >
                            -
                        </button>


                        <div
                            id="black-value"
                            class="number-value"
                        >
                            1세트
                        </div>


                        <button
                            class="number-button"
                            data-action="plus"
                            data-target="black"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- 청소 이벤트 -->

                <div class="setting-row">

                    <div class="setting-name">

                        청소시간

                        <button
                            id="cleaning-info-button"
                            class="info-button"
                            type="button"
                        >
                            ?
                        </button>

                    </div>


                    <div class="choice-buttons">

                        <button
                            id="cleaning-yes-button"
                            class="choice-button"
                            type="button"
                        >
                            YES
                        </button>


                        <button
                            id="cleaning-no-button"
                            class="choice-button selected"
                            type="button"
                        >
                            NO
                        </button>

                    </div>

                </div>


                <!-- 청소시간 -->

                <div
                    id="cleaning-turn-row"
                    class="setting-row"
                >

                    <div class="setting-name">
                        청소 시간
                    </div>


                    <div class="number-control">

                        <button
                            class="number-button"
                            data-action="minus"
                            data-target="cleaningTurns"
                        >
                            -
                        </button>


                        <div
                            id="cleaning-turn-value"
                            class="number-value"
                        >
                            10턴
                        </div>


                        <button
                            class="number-button"
                            data-action="plus"
                            data-target="cleaningTurns"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- 총 세트 -->

                <div class="setting-row total-row">

                    <div class="setting-name">
                        총 카드 세트
                    </div>


                    <div
                        id="total-set-value"
                        class="total-value"
                    >
                        11세트
                    </div>

                </div>

            </div>


            <div class="popup-buttons">

                <button
                    id="game-setting-cancel-button"
                    class="popup-button cancel-button"
                >
                    CANCEL
                </button>


                <button
                    id="game-setting-start-button"
                    class="popup-button start-button"
                >
                    START
                </button>

            </div>

        </div>

    </div>



    <!-- ========================================
         메시지
    ======================================== -->

    <div
        id="message-popup"
        class="popup-background"
    >

        <div class="popup">

            <h2 id="message-title">
                안내
            </h2>


            <div
                id="message-text"
                class="message-content"
            >
            </div>


            <button
                id="message-close-button"
                class="popup-button start-button"
                style="width: 100%;"
            >
                확인
            </button>

        </div>

    </div>



<script>


// ========================================
// 기본값
// ========================================

const DEFAULT_SETTINGS = {

    layout:
        "line",

    urinal:
        12,

    zero:
        1,

    white:
        7,

    gray:
        3,

    black:
        1,

    cleaning:
        false,

    cleaningTurns:
        10
};


let gameSettings = {
    ...DEFAULT_SETTINGS
};


// ========================================
// HTML
// ========================================

const playerNameInput =
    document.getElementById(
        "player-name-input"
    );


const currentNameDisplay =
    document.getElementById(
        "current-name-display"
    );


const vsAiButton =
    document.getElementById(
        "vs-ai-button"
    );


const vsPersonButton =
    document.getElementById(
        "vs-person-button"
    );


const helpButton =
    document.getElementById(
        "help-button"
    );


const exitButton =
    document.getElementById(
        "exit-button"
    );


const gameSettingPopup =
    document.getElementById(
        "game-setting-popup"
    );


const gameSettingCancelButton =
    document.getElementById(
        "game-setting-cancel-button"
    );


const gameSettingStartButton =
    document.getElementById(
        "game-setting-start-button"
    );


const difficultySelect =
    document.getElementById(
        "difficulty-select"
    );


const layoutLineButton =
    document.getElementById(
        "layout-line-button"
    );


const layoutCircleButton =
    document.getElementById(
        "layout-circle-button"
    );


const cleaningYesButton =
    document.getElementById(
        "cleaning-yes-button"
    );


const cleaningNoButton =
    document.getElementById(
        "cleaning-no-button"
    );


const cleaningInfoButton =
    document.getElementById(
        "cleaning-info-button"
    );


const cleaningTurnRow =
    document.getElementById(
        "cleaning-turn-row"
    );


const urinalValue =
    document.getElementById(
        "urinal-value"
    );


const zeroValue =
    document.getElementById(
        "zero-value"
    );


const whiteValue =
    document.getElementById(
        "white-value"
    );


const grayValue =
    document.getElementById(
        "gray-value"
    );


const blackValue =
    document.getElementById(
        "black-value"
    );


const cleaningTurnValue =
    document.getElementById(
        "cleaning-turn-value"
    );


const totalSetValue =
    document.getElementById(
        "total-set-value"
    );


const messagePopup =
    document.getElementById(
        "message-popup"
    );


const messageTitle =
    document.getElementById(
        "message-title"
    );


const messageText =
    document.getElementById(
        "message-text"
    );


const messageCloseButton =
    document.getElementById(
        "message-close-button"
    );


// ========================================
// 이름
// ========================================

function getPlayerName() {

    const name =
        playerNameInput
            .value
            .trim();


    if (
        name === ""
    ) {

        return "PLAYER";
    }


    return name;
}


playerNameInput.addEventListener(
    "input",
    () => {

        currentNameDisplay.textContent =
            getPlayerName();
    }
);


playerNameInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Enter"
        ) {

            playerNameInput.blur();
        }
    }
);


// ========================================
// 메시지
// ========================================

function showMessage(
    title,
    message
) {

    messageTitle.textContent =
        title;


    messageText.innerHTML =
        message;


    messagePopup.style.display =
        "flex";
}


messageCloseButton.addEventListener(
    "click",
    () => {

        messagePopup.style.display =
            "none";
    }
);


// ========================================
// 총 세트
// ========================================

function getTotalSets() {

    return (
        gameSettings.white +
        gameSettings.gray +
        gameSettings.black
    );
}


// ========================================
// UI 갱신
// ========================================

function updateSettingDisplay() {

    urinalValue.textContent =
        gameSettings.urinal +
        "개";


    zeroValue.textContent =
        gameSettings.zero +
        "장";


    whiteValue.textContent =
        gameSettings.white +
        "세트";


    grayValue.textContent =
        gameSettings.gray +
        "세트";


    blackValue.textContent =
        gameSettings.black +
        "세트";


    cleaningTurnValue.textContent =
        gameSettings.cleaningTurns +
        "턴";


    totalSetValue.textContent =
        getTotalSets() +
        "세트";


    // 배치 형태

    if (
        gameSettings.layout ===
        "line"
    ) {

        layoutLineButton
            .classList.add(
                "selected"
            );


        layoutCircleButton
            .classList.remove(
                "selected"
            );

    }

    else {

        layoutCircleButton
            .classList.add(
                "selected"
            );


        layoutLineButton
            .classList.remove(
                "selected"
            );
    }


    // 청소

    if (
        gameSettings.cleaning
    ) {

        cleaningYesButton
            .classList.add(
                "selected"
            );


        cleaningNoButton
            .classList.remove(
                "selected"
            );


        cleaningTurnRow.style.display =
            "flex";

    }

    else {

        cleaningNoButton
            .classList.add(
                "selected"
            );


        cleaningYesButton
            .classList.remove(
                "selected"
            );


        cleaningTurnRow.style.display =
            "none";
    }
}


// ========================================
// 기본값 복원
// ========================================

function resetGameSettings() {

    gameSettings = {
        ...DEFAULT_SETTINGS
    };


    updateSettingDisplay();
}


// ========================================
// 배치 형태
// ========================================

layoutLineButton.addEventListener(
    "click",
    () => {

        gameSettings.layout =
            "line";


        updateSettingDisplay();
    }
);


layoutCircleButton.addEventListener(
    "click",
    () => {

        gameSettings.layout =
            "circle";


        updateSettingDisplay();
    }
);


// ========================================
// 청소 YES / NO
// ========================================

cleaningYesButton.addEventListener(
    "click",
    () => {

        gameSettings.cleaning =
            true;


        updateSettingDisplay();
    }
);


cleaningNoButton.addEventListener(
    "click",
    () => {

        gameSettings.cleaning =
            false;


        updateSettingDisplay();
    }
);


// ========================================
// 청소 설명
// ========================================

cleaningInfoButton.addEventListener(
    "click",
    () => {

        showMessage(
            "청소 이벤트",
            `
                <div class="help-main-text">
                    게임중 무작위로 청소시간이 예고됩니다.
                </div>

                <div class="help-main-text">
                    예고 후 비어있는 변기중 한변기를 설정한 턴동안 청소합니다.
                </div>

                <div class="help-main-text">
                    청소중인 변기 옆에 설 수 없습니다.
                </div>

                <div class="help-main-text">
                    청소 이벤트의 발생 확률은 2%입니다
                </div>
            `
        );
    }
);


// ========================================
// 숫자 변경
// ========================================

function changeSetting(
    target,
    amount
) {

    // ====================================
    // 변기
    // ====================================

    if (
        target ===
        "urinal"
    ) {

        const nextValue =
            gameSettings.urinal +
            amount;


        if (
            nextValue < 8 ||
            nextValue > 40
        ) {

            showMessage(
                "안내",
                `
                    <div class="help-main-text">
                        변기의 수는 8~40 사이입니다.
                    </div>
                `
            );


            return;
        }


        gameSettings.urinal =
            nextValue;


        updateSettingDisplay();


        return;
    }


    // ====================================
    // 0 카드
    // ====================================

    if (
        target ===
        "zero"
    ) {

        const nextValue =
            gameSettings.zero +
            amount;


        if (
            nextValue < 0
        ) {

            return;
        }


        gameSettings.zero =
            nextValue;


        updateSettingDisplay();


        return;
    }


    // ====================================
    // 청소시간
    // ====================================

    if (
        target ===
        "cleaningTurns"
    ) {

        const nextValue =
            gameSettings.cleaningTurns +
            amount;


        if (
            nextValue < 2 ||
            nextValue > 50
        ) {

            showMessage(
                "안내",
                `
                    <div class="help-main-text">
                        청소시간은 2~50턴 사이입니다.
                    </div>
                `
            );


            return;
        }


        gameSettings.cleaningTurns =
            nextValue;


        updateSettingDisplay();


        return;
    }


    // ====================================
    // 카드 세트
    // ====================================

    if (
        target === "white" ||
        target === "gray" ||
        target === "black"
    ) {

        const nextValue =
            gameSettings[target] +
            amount;


        if (
            nextValue < 0
        ) {

            return;
        }


        const nextTotal =
            getTotalSets() +
            amount;


        if (
            nextTotal < 7
        ) {

            showMessage(
                "안내",
                `
                    <div class="help-main-text">
                        세트의 총합은 최소 7세트입니다.
                    </div>
                `
            );


            return;
        }


        if (
            nextTotal > 100
        ) {

            showMessage(
                "안내",
                `
                    <div class="help-main-text">
                        세트의 총합은 최대 100세트입니다.
                    </div>
                `
            );


            return;
        }


        gameSettings[target] =
            nextValue;


        updateSettingDisplay();
    }
}


// ========================================
// - / +
// ========================================

document
    .querySelectorAll(
        ".number-button"
    )
    .forEach(
        (button) => {

            button.addEventListener(
                "click",
                () => {

                    const target =
                        button.dataset.target;


                    const amount =
                        button.dataset.action ===
                        "plus"
                            ? 1
                            : -1;


                    changeSetting(
                        target,
                        amount
                    );
                }
            );
        }
    );


// ========================================

vsAiButton.addEventListener(

);

// ========================================
// 설정 취소
// ========================================

gameSettingCancelButton.addEventListener(
    "click",
    () => {

        gameSettingPopup.style.display =
            "none";
    }
);


// ========================================
// VS AI 시작
// ========================================

gameSettingStartButton.addEventListener(
    "click",
    () => {

        const playerName =
            getPlayerName();


        const totalSets =
            getTotalSets();


        if (
            totalSets < 7
        ) {

            showMessage(
                "안내",
                `
                    <div class="help-main-text">
                        세트의 총합은 최소 7세트입니다.
                    </div>
                `
            );


            return;
        }


        if (
            totalSets > 100
        ) {

            showMessage(
                "안내",
                `
                    <div class="help-main-text">
                        세트의 총합은 최대 100세트입니다.
                    </div>
                `
            );


            return;
        }


        if (
            gameSettings.urinal < 8 ||
            gameSettings.urinal > 40
        ) {

            showMessage(
                "안내",
                `
                    <div class="help-main-text">
                        변기의 수는 8~40 사이입니다.
                    </div>
                `
            );


            return;
        }


        const params =
            new URLSearchParams();


        params.set(
            "mode",
            "ai"
        );


        params.set(
            "difficulty",
            difficultySelect.value
        );


        params.set(
            "name",
            playerName
        );


        params.set(
            "layout",
            gameSettings.layout
        );


        params.set(
            "urinals",
            gameSettings.urinal
        );


        params.set(
            "zero",
            gameSettings.zero
        );


        params.set(
            "white",
            gameSettings.white
        );


        params.set(
            "gray",
            gameSettings.gray
        );


        params.set(
            "black",
            gameSettings.black
        );


        params.set(
            "cleaning",
            gameSettings.cleaning
                ? "yes"
                : "no"
        );


        params.set(
            "cleaningTurns",
            gameSettings.cleaningTurns
        );


        window.location.href =
            "game.html?" +
            params.toString();
    }
);

// ========================================

exitButton.addEventListener(
    "click",
    () => {

        const result =
            confirm(
                "게임을 종료하시겠습니까?"
            );


        if (
            !result
        ) {

            return;
        }


        window.close();


        setTimeout(
            () => {

                showMessage(
                    "EXIT",
                    `
                        <div class="help-main-text">
                            브라우저 테스트 버전에서는 창을 자동으로 닫지 못할 수 있습니다.
                        </div>
                    `
                );

            },
            200
        );
    }
);
